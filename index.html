  <!-- Fallback Error Overlay Styling (DeepSeek Spec adapted for LAF) -->
  <style>
    ._sri-logo {
      position: absolute;
      left: 16px;

      display: inline-flex;

      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;

      font-family: inherit;
      box-sizing: border-box;
      transition: all 0.2s ease;

  <!-- Script Error Handler (Adapted from DeepSeek) -->
  <script>
    (() => {
      "use strict";
      const translations = {
        en: { d: "Unable to load LAF AI resources. Please refresh and try again.", b: "Reload", logo: "LAF AI" },
        zh: { d: "LAF AI 页面资源加载异常，请刷新重试", b: "重新加载", logo: "LAF AI" }
      };
      window._sriCk = function() {
        let langList = navigator.languages || [navigator.language || ""];
        let userLang = "en";
        for (let i = 0; i < langList.length; i++) {
          let code = langList[i].toLowerCase().split("-")[0];
          if (translations[code]) { userLang = code; break; }
        }
        let t = translations[userLang] || translations.en;
        let html = '<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgPneYG2HNT8jsgsviQT-3j0Mj4tN_xUqwl9a9KYP9YE5Bu8TVGPXSLDI&s=10" alt="' + t.logo + '" class="_sri-logo">';
        html += '<div class="_sri-ck"><img class="img" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgPneYG2HNT8jsgsviQT-3j0Mj4tN_xUqwl9a9KYP9YE5Bu8TVGPXSLDI&s=10" alt="LAF"><p class="desc">' + t.d + '</p><button class="btn" onclick="location.reload()">' + t.b + '</button></div>';
        let container = document.createElement("div");
        document.body.replaceChildren(container);
        container.innerHTML = html;
      };
    })();
  </script>
